spring.application.name=form-recetas

# PostgreSQL. La contraseña se solicita en scripts/iniciar-backend-seguro.ps1
# o se inyecta mediante la variable DB_PASSWORD. No existe valor predeterminado.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/form_recetas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Las tablas se crean con el script SQL existente; Spring no debe recrearlas ni borrarlas.
spring.sql.init.mode=never

server.port=8080
server.address=${SERVER_ADDRESS:127.0.0.1}

# URLs públicas/locales de RecetON.
receton.oauth2.issuer=${RECETON_OAUTH2_ISSUER:http://api.receton.test:8080}
receton.oauth2.redirect-uris=${RECETON_OAUTH2_REDIRECT_URIS:http://receton.test:4200/oauth-callback,http://localhost:4200/oauth-callback,http://127.0.0.1:4200/oauth-callback,https://oauth.pstmn.io/v1/callback}
receton.frontend.url=${RECETON_FRONTEND_URL:http://receton.test:4200}
receton.cors.allowed-origins=${RECETON_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://receton.test:4200}

# Firma JWT: almacén PKCS#12 privado y externo al repositorio.
receton.jwt.keystore-path=${RECETON_JWT_KEYSTORE_PATH:secrets/receton-jwt.p12}
receton.jwt.keystore-password=${RECETON_JWT_KEYSTORE_PASSWORD:}
receton.jwt.key-alias=${RECETON_JWT_KEY_ALIAS:receton-jwt}

# Cookies de sesión: HttpOnly y SameSite=Lax. En HTTPS público, el script seguro
# activa Secure automáticamente; en desarrollo HTTP local permanece desactivado.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${RECETON_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# Límites de solicitudes sensibles (por IP y, para login, por nombre de usuario).
receton.security.rate-limit.login.max-attempts=${RECETON_RATE_LIMIT_LOGIN_MAX_ATTEMPTS:8}
receton.security.rate-limit.login.window-seconds=${RECETON_RATE_LIMIT_LOGIN_WINDOW_SECONDS:600}
receton.security.rate-limit.oauth-token.max-attempts=${RECETON_RATE_LIMIT_OAUTH_TOKEN_MAX_ATTEMPTS:30}
receton.security.rate-limit.oauth-token.window-seconds=${RECETON_RATE_LIMIT_OAUTH_TOKEN_WINDOW_SECONDS:60}
receton.security.rate-limit.oauth-authorize.max-attempts=${RECETON_RATE_LIMIT_OAUTH_AUTHORIZE_MAX_ATTEMPTS:60}
receton.security.rate-limit.oauth-authorize.window-seconds=${RECETON_RATE_LIMIT_OAUTH_AUTHORIZE_WINDOW_SECONDS:60}

# ngrok termina TLS y reenvía encabezados X-Forwarded-* al backend local.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
